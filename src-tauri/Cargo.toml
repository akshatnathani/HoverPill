[package]
name = "hoverpill"
version = "0.4.1"
description = "A Dynamic Island-style smart notch for Windows and Linux"
edition = "2021"

[workspace]
members = ["crates/media", "crates/notify"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "macros"] }
httparse = "1"
getrandom = "0.4"
hoverpill-media = { path = "crates/media" }
hoverpill-notify = { path = "crates/notify" }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
# Google Calendar and Sign in with ChatGPT: HTTPS, PKCE, and verifying OpenAI's ID token.
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2"] }
futures-util = "0.3"
sha2 = "0.11"
base64 = "0.23"
# Since 10, the crypto backend must be chosen explicitly; without one, verifying a token panics.
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
tauri-plugin-updater = "2"

[target.'cfg(windows)'.dependencies]
# Screenshots for ChatGPT. Windows only for now: on Linux it needs PipeWire and Wayland
# libraries, and under Wayland a plain X11 capture shows most windows black.
xcap = "0.9.8"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Volume, brightness and battery for the notch cards; the camera/microphone dots read the
# consent store through the registry.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_Power", "Win32_System_Variant", "Win32_System_Wmi"] }
winreg = "0.56"

# GTK/GDK for shaping the X input region under XWayland (see `set_input_region` in notch.rs) and
# for reaching our own X window to take the keyboard while the user types (`gdkx11::X11Window`),
# plus libX11 (through x11-dl) to spot a fullscreen app worth hiding behind (see
# `fullscreen_app_on`).
[target.'cfg(target_os = "linux")'.dependencies]
# Signal handling, to exit normally on SIGTERM/SIGINT (see `exit_on_signal` in main.rs), and
# inotify on the camera nodes, to see a camera being opened or closed (see access.rs).
libc = "0.2"
gtk = "0.18"
gdkx11 = "0.18"
x11-dl = "2"
# Client for the GNOME Shell extension that reports fullscreen state for native
# Wayland apps (see `shellext.rs`).
zbus = "5"

[profile.release]
lto = true
codegen-units = 1
strip = true
